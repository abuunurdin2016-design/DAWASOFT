<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Pharmacy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-card">
      <div class="login-brand">
        <span class="logo" id="brand-logo"></span>
        <h1>Pharmacy</h1>
        <p class="muted small">Management system · TZS</p>
      </div>

      <div class="login-tabs" role="tablist">
        <button id="tab-login" class="active">Sign in</button>
        <button id="tab-signup">Sign up</button>
        <button id="tab-forgot">Forgot</button>
      </div>

      <!-- Login -->
      <form id="form-login" autocomplete="on">
        <label class="field"><span>Username or Email</span>
          <input class="input" name="identifier" required autocomplete="username"></label>
        <label class="field"><span>Password</span>
          <input class="input" type="password" name="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <!-- Sign up -->
      <form id="form-signup" class="hidden" autocomplete="on">
        <label class="field"><span>Full name</span>
          <input class="input" name="fullName" required></label>
        <div class="grid-2">
          <label class="field"><span>Date of birth</span>
            <input class="input" type="date" name="dob"></label>
          <label class="field"><span>Profession</span>
            <select class="input" name="profession" required id="signup-profession"></select></label>
        </div>
        <label class="field"><span>Email</span>
          <input class="input" type="email" name="email" required autocomplete="email"></label>
        <div class="grid-2">
          <label class="field"><span>Preferred username</span>
            <input class="input" name="username" required autocomplete="username"></label>
          <label class="field"><span>Password</span>
            <input class="input" type="password" name="password" minlength="6" required autocomplete="new-password"></label>
        </div>
        <label class="field"><span>Profile picture (optional)</span>
          <input class="input" type="file" accept="image/*" id="signup-photo"></label>
        <p class="muted small">After signing up you can use the Home page until the owner grants you more pages.</p>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <!-- Forgot -->
      <form id="form-forgot" class="hidden">
        <p class="muted small">Enter your username or email and we will send a temporary password.</p>
        <label class="field"><span>Username or Email</span>
          <input class="input" name="identifier" required></label>
        <button class="btn btn-primary btn-block" type="submit">Send temporary password</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/format.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
