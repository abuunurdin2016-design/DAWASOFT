<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistant · Pharmacy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="ph-app">
    <div id="ph-offline-banner"></div>
    <header class="ph-header" id="ph-header" data-title="Assistant"></header>
    <main class="ph-main">
      <section class="card">
        <div class="segmented" id="mode">
          <button data-mode="item" class="active">Search by Item</button>
          <button data-mode="use">Search by Use</button>
        </div>
        <label class="field mt"><span id="search-label">Item name</span>
          <input class="input" id="assistant-search" placeholder="Type to search…" autocomplete="off"></label>
        <div id="assistant-results"></div>
      </section>

      <section class="card hidden" id="detail-card">
        <div class="card-head"><h3 id="detail-title">Item details</h3></div>
        <div id="detail-body"></div>
      </section>

      <p class="muted small">Information is read from your inventory sheet — no online AI is used.</p>
    </main>
    <nav id="ph-bottomnav"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/format.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/assistant.js"></script>
</body>
</html>
