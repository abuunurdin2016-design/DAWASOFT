<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings · Pharmacy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="ph-app">
    <div id="ph-offline-banner"></div>
    <header class="ph-header" id="ph-header" data-title="Settings"></header>
    <main class="ph-main">

      <section class="card">
        <div class="card-head"><h3>Appearance</h3></div>

        <label class="field"><span>Theme</span></label>
        <div class="segmented" id="set-theme">
          <button data-v="auto">Auto</button>
          <button data-v="light">Light</button>
          <button data-v="dark">Dark</button>
        </div>

        <label class="field mt"><span>Font</span></label>
        <div class="segmented" id="set-font">
          <button data-v="system">System</button>
          <button data-v="rounded">Rounded</button>
          <button data-v="serif">Serif</button>
          <button data-v="mono">Mono</button>
        </div>

        <label class="field mt"><span>Background</span></label>
        <div class="segmented" id="set-bg">
          <button data-v="default">Default</button>
          <button data-v="mint">Mint</button>
          <button data-v="sand">Sand</button>
          <button data-v="slate">Slate</button>
          <button data-v="violet">Violet</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Account</h3></div>
        <div id="set-account"></div>
      </section>

      <section class="card">
        <div class="card-head"><h3>Change password</h3></div>
        <label class="field"><span>Current password</span>
          <input class="input" type="password" id="cp-current" autocomplete="current-password"></label>
        <label class="field"><span>New password (min 6 characters)</span>
          <input class="input" type="password" id="cp-new" autocomplete="new-password"></label>
        <button class="btn btn-primary btn-block" id="cp-save">Update password</button>
      </section>

      <section class="card">
        <div class="card-head"><h3>System</h3></div>
        <div id="set-system"></div>
        <div class="row mt wrap">
          <button class="btn btn-ghost" id="set-sync">Sync now</button>
          <button class="btn btn-ghost" id="set-reload">Reload app</button>
        </div>
        <p class="muted small mt">Language: English · Currency: TZS. Data lives in your Google Sheet; this app keeps an offline copy on this device.</p>
      </section>

    </main>
    <nav id="ph-bottomnav"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/format.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/settings.js"></script>
</body>
</html>
