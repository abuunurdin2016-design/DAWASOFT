<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inventory · Pharmacy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .result-item { padding: .6rem .7rem; border-bottom: 1px solid var(--ph-border); cursor: pointer; display: flex; justify-content: space-between; gap: .5rem; }
    .result-item:hover { background: var(--ph-surface-2); }
    .result-item:last-child { border-bottom: none; }
    .cart-line-info { font-size: .76rem; color: var(--ph-muted); }
  </style>
</head>
<body>
  <div class="ph-app">
    <div id="ph-offline-banner"></div>
    <header class="ph-header" id="ph-header" data-title="Inventory update"></header>
    <main class="ph-main">

      <section class="card">
        <div class="segmented" id="inv-mode">
          <button data-mode="stock" class="active">Update Stock</button>
          <button data-mode="addremove">Add / Remove</button>
          <button data-mode="edit">Edit Item</button>
        </div>
        <div class="segmented mt hidden" id="sub-mode">
          <button data-sub="add" class="active">Add item</button>
          <button data-sub="remove">Remove item</button>
        </div>
      </section>

      <section class="card hidden" id="picker-card">
        <label class="field"><span id="picker-label">Find item</span>
          <input class="input" id="item-search" placeholder="Type an item name…" autocomplete="off"></label>
        <div id="item-results" class="table-wrap hidden"></div>
        <div id="item-selected"></div>
      </section>

      <section class="card hidden" id="stock-card">
        <div class="card-head"><h3>Update stock (restock)</h3><span class="muted small" id="stock-item"></span></div>
        <p class="muted small" id="stock-current"></p>
        <label class="field"><span>Quantity added *</span>
          <input class="input" type="number" min="1" step="1" id="stock-qty" placeholder="e.g. 20"></label>
        <div class="grid-2">
          <label class="field"><span>Buying price per UOM (optional)</span>
            <input class="input" type="number" min="0" step="0.01" id="stock-buying"></label>
          <label class="field"><span>New expiry date (optional)</span>
            <input class="input" type="date" id="stock-expiry"></label>
        </div>
        <button class="btn btn-primary btn-block mt" id="stock-submit">Update stock</button>
      </section>

      <section class="card hidden" id="add-card">
        <div class="card-head"><h3>Add a new item</h3></div>
        <div id="add-form"></div>
        <button class="btn btn-primary btn-block mt" id="add-submit">Add item</button>
      </section>

      <section class="card hidden" id="edit-card">
        <div class="card-head"><h3>Edit item</h3><span class="muted small" id="edit-item-id"></span></div>
        <div id="edit-form"></div>
        <button class="btn btn-primary btn-block mt" id="edit-submit">Save changes</button>
      </section>

    </main>
    <nav id="ph-bottomnav"></nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/format.js"></script>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/inventory.js"></script>
</body>
</html>
